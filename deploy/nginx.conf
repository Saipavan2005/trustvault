# /etc/nginx/conf.d/trustvault.conf
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/trustvault.crt;   # self-signed for the demo, or certbot with a domain
    ssl_certificate_key /etc/nginx/ssl/trustvault.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 11m;

    location = /login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/trustvault_proxy.conf;
    }
    location / {
        limit_req zone=general burst=40 nodelay;
        include /etc/nginx/trustvault_proxy.conf;
    }
}
