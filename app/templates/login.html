{% extends "base.html" %}
{% block title %}Sign in · TrustVault{% endblock %}
{% block body %}
<div class="card login">
  <h1>TrustVault</h1>
  <p class="sub">Sign in. Every sign-in and every refused attempt is recorded.</p>
  {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login_submit') }}">
    <input type="hidden" name="login_token" value="{{ token }}">
    <p><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required style="width:100%"></p>
    <p><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required style="width:100%"></p>
    <button class="btn" type="submit" style="width:100%">Sign in</button>
  </form>
</div>
{% endblock %}
